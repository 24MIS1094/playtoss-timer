<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toss & Stopwatch App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body onload="startClock()">

  <h1 class="title">Online Toss & Timer App</h1>

  <!-- DATE & TIME -->
  <div class="clock">
    <div id="date">Loading date...</div>
    <div id="time">Loading time...</div>
  </div>

  <!-- COIN TOSS -->
  <div class="section">
    <h2>Coin Toss</h2>

    <div class="coin-container">
      <div id="coin" class="coin" onclick="flipCoin()">
        <div class="coin-face front">H</div>
        <div class="coin-face back">T</div>
      </div>
    </div>

    <p id="tossResult">Click the coin to flip</p>
  </div>

  <!-- STOPWATCH -->
  <div class="section">
    <h2>Stopwatch</h2>

    <div id="stopwatch">00:00</div>

    <button onclick="startWatch()">Start</button>
    <button onclick="stopWatch()">Stop</button>
    <button onclick="resetWatch()">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
